server:
  port: ${SERVER_PORT:8009}

agent:
  token: ${AGENT_TOKEN:1234}
  working-dir: ${AGENT_WORKING_DIR:/tmp}
  default-shell: ${AGENT_DEFAULT_SHELL:/bin/sh}
  max-concurrent: ${AGENT_MAX_CONCURRENT:5}
  adk:
    enabled: ${AGENT_ADK_ENABLED:true}
    provider: ${AGENT_ADK_PROVIDER:ollama}  # "gemini" or "ollama"
    model: ${AGENT_ADK_MODEL:gemini-flash-lite-latest}
    api-key: ${GOOGLE_AI_API_KEY:}
    # Ollama settings (when provider=ollama)
    ollama-base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    ollama-model: ${OLLAMA_MODEL:minimax-m3:cloud}

searxng:
  base-url: ${SEARXNG_BASE_URL:http://localhost:8081}
ddgo:
  base-url: ${DDGO_BASE_URL:https://duckduckgo.com}
  html: ${DDGO_HTML:https://html.duckduckgo.com/html}

# Note: the Telegram bot is now DB-driven, not gated by a yml/env flag.
# It registers and polls iff a non-empty botToken is present in the
# skill_configs row for "telegram" (configured via the dashboard). Token
# and allowlist changes hot-reload every 5s.

spring:
  datasource:
    # SQLite (embedded file, no server). Override the path via SPRING_DATASOURCE_URL.
    # WAL + busy_timeout let reads overlap with the single writer; pool size 1
    # (set below) serializes writes so SQLite never returns SQLITE_BUSY.
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/runner.db?journal_mode=WAL&busy_timeout=5000}
    driver-class-name: org.sqlite.JDBC
    username:
    password:
    hikari:
      maximum-pool-size: 1
  jpa:
    # OSIV off: the /daemon/{id}/work long-poll holds a request open for ~30s.
    # With OSIV on (Spring Boot default) the Hibernate session — and the single
    # pooled connection — is held for the whole DeferredResult wait, starving
    # the @Scheduled offline sweep (and any other DB op) under pool-size 1.
    # Off is also the recommended setting for a pure REST backend.
    open-in-view: false
    hibernate:
      ddl-auto: update   # SQLite only supports ADD COLUMN; fine for fresh schema
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
