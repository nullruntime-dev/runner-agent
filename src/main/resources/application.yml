server:
  port: ${SERVER_PORT:8009}

agent:
  token: ${AGENT_TOKEN:1234}
  working-dir: ${AGENT_WORKING_DIR:/tmp}
  default-shell: ${AGENT_DEFAULT_SHELL:/bin/sh}
  max-concurrent: ${AGENT_MAX_CONCURRENT:5}
  adk:
    enabled: ${AGENT_ADK_ENABLED:true}
    provider: ${AGENT_ADK_PROVIDER:ollama}  # "gemini" or "ollama"
    model: ${AGENT_ADK_MODEL:gemini-flash-lite-latest}
    api-key: ${GOOGLE_AI_API_KEY:}
    # Ollama settings (when provider=ollama)
    ollama-base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    ollama-model: ${OLLAMA_MODEL:minimax-m3:cloud}

searxng:
  base-url: ${SEARXNG_BASE_URL:http://localhost:8081}
ddgo:
  base-url: ${DDGO_BASE_URL:https://duckduckgo.com}
  html: ${DDGO_HTML:https://html.duckduckgo.com/html}

# Telegram bot auto-registers with the Telegram API on startup via the
# telegrambots Spring Boot starter. Gate the bean behind this flag so the
# app doesn't 404 on startup when no bot token is configured. Set
# -DTELEGRAM_ENABLED=true (or TELEGRAM_ENABLED env) once you've configured
# a bot token in the dashboard.
telegram:
  enabled: ${TELEGRAM_ENABLED:false}

spring:
  datasource:
    # PostgreSQL only. Default points at the local docker-compose `postgres` service.
    # Override SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD for other environments.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/runner}
    username: ${SPRING_DATASOURCE_USERNAME:runner}
    password: ${SPRING_DATASOURCE_PASSWORD:runner}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
